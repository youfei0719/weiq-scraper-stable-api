[project]
name = "weiq-scraper"
version = "0.2.0"
description = "WEIQ data crawler with resumable CLI + lightweight API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.1",
    "playwright>=1.58.0",
    "plotly>=6.0.0",
    "streamlit>=1.44.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
weiq-scraper = "scraper_runtime:main"
